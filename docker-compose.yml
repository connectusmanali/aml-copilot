# Local stack for the AML copilot.
#   make up       -> everything (needs ~8-12 GB free RAM)
#   make up-lite  -> core only: Postgres + Redpanda (~2 GB), enough for Steps 1-3
# Both run `make db-migrate` afterwards.
name: aml-copilot

services:
  # ---------- core (always on) ----------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${AML_POSTGRES_DB:-aml}
      POSTGRES_USER: ${AML_POSTGRES_USER:-aml}
      POSTGRES_PASSWORD: ${AML_POSTGRES_PASSWORD:-change-me-locally}
    ports: ["${AML_POSTGRES_PORT:-5432}:5432"]
    # Schema is applied by `make db-migrate` (aml-db migrate), not by an init script, so local,
    # CI and the cloud all build the schema the same way.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AML_POSTGRES_USER:-aml} -d ${AML_POSTGRES_DB:-aml}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --mode dev-container
    ports: ["19092:19092", "9644:9644"]
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------- full profile ----------
  neo4j:
    image: neo4j:5.24-community
    profiles: [full]
    environment:
      NEO4J_AUTH: ${AML_NEO4J_USER:-neo4j}/${AML_NEO4J_PASSWORD:-change-me-locally}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j:/data]

  temporal:
    image: temporalio/auto-setup:1.25.2
    profiles: [full]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${AML_POSTGRES_USER:-aml}
      POSTGRES_PWD: ${AML_POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: [full]
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8080:8080"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    profiles: [full]
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts --artifacts-destination /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflow:/mlflow]

volumes:
  pgdata:
  redpanda:
  neo4j:
  mlflow:
